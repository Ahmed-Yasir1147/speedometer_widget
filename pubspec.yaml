name: speedometer_widget
description: "Highly customizable widget to be used as a speedometer. It animates when value of speed or fuel changes. It has support for all Flutter platforms."
version: 0.2.0
repository: https://github.com/Ahmed-Yasir1147/speedometer_widget.git

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets: 
    - assets/fonts/

  fonts:
    - family: DigitalNumbers
      fonts:
        - asset: assets/fonts/digital_numbers.ttf

license: MIT

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

  